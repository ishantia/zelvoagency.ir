<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه پیدا نشد | Zelvo Agency</title>
    
    <meta name="theme-color" content="#05070A" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet" />
    
    <style>
      body {
        margin: 0;
        background-color: #05070A;
        color: #E2E8F0;
        font-family: 'Vazirmatn', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 1rem;
        box-sizing: border-box;
        overflow: hidden;
      }
      
      .bg-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
        z-index: -1;
      }

      .glow-text {
        font-size: 8rem;
        font-weight: 800;
        margin: 0;
        background: linear-gradient(to right, #8b5cf6, #d946ef);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        text-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
      }

      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 1rem;
        margin-bottom: 2.5rem;
        color: #94a3b8;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.875rem 2rem;
        background-color: #8b5cf6;
        color: white;
        text-decoration: none;
        font-weight: 600;
        border-radius: 0.75rem;
        transition: all 0.3s ease;
        box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.3), 0 18px 40px -16px rgba(128, 48, 224, 0.55);
      }

      a:hover {
        background-color: #9440f0;
        transform: translateY(-2px);
      }
      
      a:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <h1 class="glow-text">404</h1>
    <h2>متأسفانه صفحه‌ای که دنبالش بودید پیدا نشد!</h2>
    <a href="/">بازگشت به صفحه اصلی</a>
  </body>
</html>
